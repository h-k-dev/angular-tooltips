<header class="dialog-header">
  <h2 mat-dialog-title>Sign in</h2>
  <button mat-icon-button mat-dialog-close class="dialog-header__close" aria-label="Close dialog"
    [ngTooltip]="'Close without signing in'" ngTooltipPlacement="left">
    <mat-icon>close</mat-icon>
  </button>
</header>

<mat-dialog-content class="dialog-content">
  <p class="dialog-hint">
    Dialogs live in the top layer — and so does the tooltip, so it is never
    clipped. This viewport scrolls: tooltips track their anchors while you
    scroll and hide the moment an anchor leaves the visible area.
  </p>

  @for (placement of placements; track placement) {
  <section class="direction-group">
    <h3 class="direction-group__title">{{ placement }}</h3>
    <div class="direction-group__row">
      <button mat-stroked-button [ngTooltip]="'<button> — placement: ' + placement"
        [ngTooltipPlacement]="placement">
        Button
      </button>
      <a class="demo-link" href="#" (click)="$event.preventDefault()"
        [ngTooltip]="'<a href> — placement: ' + placement" [ngTooltipPlacement]="placement">
        Link
      </a>
      <span class="demo-span" tabindex="0" [ngTooltip]="'<span> — placement: ' + placement"
        [ngTooltipPlacement]="placement">
        Span
      </span>
      <div class="demo-div" tabindex="0" [ngTooltip]="'<div> — placement: ' + placement"
        [ngTooltipPlacement]="placement">
        Div
      </div>
    </div>
  </section>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [ngTooltip]="'Dismiss the dialog'" ngTooltipPlacement="top">
    Cancel
  </button>
  <button mat-flat-button mat-dialog-close [ngTooltip]="'Pretend to sign in — this is only a demo'"
    ngTooltipPlacement="top">
    <mat-icon>login</mat-icon> Sign in
  </button>
</mat-dialog-actions>
