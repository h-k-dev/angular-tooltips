<mat-toolbar>
  <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle page navigation">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="spacer"></div>

  <div class="toolbar__actions">
    <button mat-icon-button (click)="toggleTheme()" [hkTooltip]="'Toggle dark/light mode'">
      @if (theme() === 'dark') {
      <mat-icon>dark_mode</mat-icon>
      } @else {
      <mat-icon>light_mode</mat-icon>
      }
    </button>

    <button mat-flat-button (click)="openLogin()"
      [hkTooltip]="'Open the sign-in dialog — tooltips escape into the top layer'" hkTooltipPlacement="bottom">
      <mat-icon>login</mat-icon> Login
    </button>
  </div>
</mat-toolbar>

<mat-drawer-container class="layout">
  <mat-drawer #drawer [mode]="narrow() ? 'over' : 'side'" [opened]="!narrow()" class="layout__aside">
    <!-- On narrow viewports a link pick also dismisses the overlay. -->
    <nav class="aside-nav" (click)="narrow() && drawer.close()">
      <a mat-button class="aside-nav__link" routerLink="/" routerLinkActive="aside-nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }">
        Tooltips
      </a>
      <a mat-button class="aside-nav__link" routerLink="/invoker" routerLinkActive="aside-nav__link--active">
        Invoker
      </a>
      <a mat-button class="aside-nav__link" routerLink="/js-anchor" routerLinkActive="aside-nav__link--active">
        JS Anchor
      </a>
      <a mat-button class="aside-nav__link" routerLink="/theming" routerLinkActive="aside-nav__link--active">
        Theming
      </a>
      <a mat-button class="aside-nav__link" routerLink="/api" routerLinkActive="aside-nav__link--active">
        API
      </a>
      <a mat-button class="aside-nav__link" routerLink="/inspiration" routerLinkActive="aside-nav__link--active">
        Inspiration
      </a>
    </nav>
  </mat-drawer>

  <mat-drawer-content class="layout__content">
    <main>
      <router-outlet />
    </main>
  </mat-drawer-content>
</mat-drawer-container>
