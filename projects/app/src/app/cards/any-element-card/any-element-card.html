<h2>Works on any element</h2>
<p>
  The directive attaches to plain HTML, not just buttons.
  <strong>Tap</strong> each tile on a touch screen — or hover with a
  mouse, or focus with the keyboard.
</p>
<div class="tag-grid">
  <button class="tag-item" [hkTooltip]="'A native <button> — hover, focus and tap all work'"
    hkTooltipPlacement="top">
    &lt;button&gt;
  </button>
  <a class="tag-item" href="#" (click)="$event.preventDefault()"
    [hkTooltip]="'An <a href> link — supporting browsers use native Interest Invokers, long-press on touch'"
    hkTooltipPlacement="top">
    &lt;a&gt;
  </a>
  <span class="tag-item" tabindex="0" [hkTooltip]="'An inline <span> — no button semantics needed'"
    hkTooltipPlacement="bottom">
    &lt;span&gt;
  </span>
  <div class="tag-item" tabindex="0" [hkTooltip]="'A plain <div> block — any element can be an anchor'"
    hkTooltipPlacement="bottom">
    &lt;div&gt;
  </div>
  <code class="tag-item" tabindex="0" [hkTooltip]="'A <code> snippet — annotate tokens mid-sentence'"
    hkTooltipPlacement="top">
    &lt;code&gt;
  </code>
  <img class="tag-item tag-item--img" src="favicon.ico" alt="Angular logo" tabindex="0"
    [hkTooltip]="'An <img> — perfect for avatars and thumbnails'" hkTooltipPlacement="bottom" />
  <input class="tag-item tag-item--input" type="text" placeholder="<input>"
    [hkTooltip]="'An <input> — the tooltip also shows on focus'" hkTooltipPlacement="top" />
  <mat-icon class="tag-item tag-item--icon" tabindex="0" [hkTooltip]="'A <mat-icon> component host works too'"
    hkTooltipPlacement="bottom">info</mat-icon>
</div>
